name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: offline tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -r requirements.txt -c constraints.txt
      # No network and no model: every Stripe and Claude call is faked in the tests.
      - name: Test
        run: python -m pytest tests -q
